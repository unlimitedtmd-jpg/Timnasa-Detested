<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>averages bot | Pair</title>
  <link rel="icon" type="jpg" href="https://raw.githubusercontent.com/NjabuloJf/njabulo-data/main/njabuloimg/njabuloimg3.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #090a0f; /* Background ya giza kwa ajili ya nyota */
      overflow: hidden;
      color: #ffffff;
      position: relative;
    }

    /* ========== STAR BACKGROUND ANIMATION ========== */
    .stars-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 10px #ffffff; }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    /* ========== SCROLLING MARQUEE TEXT ========== */
    .marquee-container {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(102, 126, 234, 0.2);
      backdrop-filter: blur(5px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 0;
      z-index: 10;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-text {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 700;
      color: #00f2fe;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-left: 100%;
      animation: marquee 15s linear infinite;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* ========== CONTAINER ========== */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 20px;
      margin-top: 40px;
    }

    /* ========== BOT AVATAR ========== */
    .bot-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
      animation: float 4s ease-in-out infinite;
      transition: transform 0.3s;
    }

    .bot-avatar:hover {
      transform: scale(1.05);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ========== MAIN CARD ========== */
    .box {
      width: 420px;
      max-width: 95%;
      padding: 40px 35px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      text-align: center;
      transition: all 0.3s ease;
    }

    .box:hover {
      box-shadow: 
        0 30px 80px rgba(102, 126, 234, 0.25),
        0 10px 30px rgba(0, 0, 0, 0.4);
      transform: translateY(-2px);
    }

    /* ========== DECORATIVE LINE ========== */
    .decorative-line {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      margin: 8px auto 16px;
      border-radius: 10px;
    }

    /* ========== TITLE ========== */
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .title span {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
      font-weight: 400;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* ========== INPUT CONTAINER ========== */
    .input-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 6px 6px 6px 18px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .input-container:focus-within {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
      background: rgba(255, 255, 255, 0.1);
    }

    .input-container i {
      color: #9ca3af;
      font-size: 1rem;
    }

    .input-container input {
      flex: 1;
      border: none;
      padding: 14px 0;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    .input-container input::placeholder {
      color: #6b7280;
      font-weight: 400;
    }

    .input-container input::-webkit-outer-spin-button,
    .input-container input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .input-container input[type=number] {
      -moz-appearance: textfield;
    }

    .input-container button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      white-space: nowrap;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .input-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .input-container button:active {
      transform: scale(0.97);
    }

    /* ========== MESSAGES ========== */
    #waiting-message {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #667eea;
      font-weight: 500;
      display: none;
      animation: pulseText 1.5s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #pair {
      margin-top: 16px;
      font-size: 1rem;
      color: #ffffff;
      font-weight: 600;
      word-break: break-all;
    }

    #pair .code-label {
      color: #9ca3af;
      font-weight: 400;
      font-size: 0.85rem;
    }

    #pair .code-value {
      color: #a78bfa;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 2px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(118, 75, 162, 0.2);
      display: inline-block;
      transition: all 0.3s ease;
      border: 2px dashed #764ba2;
    }

    #pair .code-value:hover {
      background: rgba(118, 75, 162, 0.4);
      border-color: #a78bfa;
      transform: scale(1.02);
    }

    /* ========== COPY BUTTON ========== */
    #copy-btn {
      display: none;
      margin-top: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      padding: 12px 32px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      letter-spacing: 0.3px;
    }

    #copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }

    #copy-btn:active {
      transform: scale(0.97);
    }

    /* ========== FOOTER ========== */
    .footer {
      margin-top: 22px;
      font-size: 0.75rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer .heart {
      color: #ef4444;
      animation: heartBeat 1.5s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .footer a:hover {
      color: #764ba2;
    }

    .footer .dot {
      color: #4b5563;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .box {
        padding: 28px 20px;
      }
      .title {
        font-size: 1.1rem;
      }
      .input-container {
        flex-direction: column;
        padding: 8px;
        gap: 8px;
        border-radius: 14px;
      }
      .input-container input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }
      .input-container button {
        width: 100%;
        justify-content: center;
        padding: 14px;
      }
      .bot-avatar {
        width: 80px;
        height: 80px;
        font-size: 38px;
      }
      #pair .code-value {
        font-size: 1rem;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== SCROLLING BANNER ========== -->
  <div class="marquee-container">
    <div class="marquee-text">
      Welcome back to averages bot • Welcome back to averages bot • Welcome back to averages bot
    </div>
  </div>

  <!-- ========== DYNAMIC STARS BACKGROUND ========== -->
  <div class="stars-container" id="stars-container"></div>

  <!-- ========== MAIN CONTAINER ========== -->
  <div class="container">
    <div class="box" id="box">

      <!-- Bot Avatar -->
      <div class="bot-avatar">
        <i class="fas fa-robot"></i>
      </div>

      <!-- Title -->
      <div class="title">
        <span>averages</span> bot
      </div>
      <div class="decorative-line"></div>
      <div class="subtitle">pair your WhatsApp number</div>
      <span class="badge"><i class="fas fa-bolt"></i> live</span>

      <!-- Input -->
      <div class="input-container">
        <i class="fas fa-phone-alt"></i>
        <input type="number" id="number" placeholder="26777821911" autofocus>
        <button id="submit">
          <i class="fas fa-link" style="margin-right: 6px;"></i> Pair
        </button>
      </div>

      <!-- Messages -->
      <div id="waiting-message">
        <i class="fas fa-spinner fa-spin"></i> Generating code...
      </div>

      <div id="pair"></div>

      <button id="copy-btn">
        <i class="fas fa-copy" style="margin-right: 6px;"></i> Copy Code
      </button>

      <!-- Footer -->
      <div class="footer">
        <span>© 2026</span>
        <span class="dot">•</span>
        <span>Made with <span class="heart">❤</span> by <a href="#" target="_blank">Averages Bot</a></span>
        <span class="dot">•</span>
        <span>v1.0</span>
      </div>

    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdnjs.cloudflare.com/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    // Script ya kutengeneza nyota zinazobadilika upande wa background
    const starsContainer = document.getElementById('stars-container');
    const numberOfStars = 80;

    for (let i = 0; i < numberOfStars; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      
      const size = Math.random() * 3 + 1; // Ukubwa wa nyota (1px - 4px)
      const posX = Math.random() * 100;
      const posY = Math.random() * 100;
      const duration = Math.random() * 3 + 1.5; // Kasi ya kumeremeta
      const delay = Math.random() * 3;

      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${posX}%`;
      star.style.top = `${posY}%`;
      star.style.animationDuration = `${duration}s`;
      star.style.animationDelay = `${delay}s`;

      starsContainer.appendChild(star);
    }

    // Logic za Pairing Code
    const pairDiv = document.getElementById("pair");
    const submitBtn = document.getElementById("submit");
    const numberInput = document.getElementById("number");
    const waitingMsg = document.getElementById("waiting-message");
    const copyBtn = document.getElementById("copy-btn");

    let currentCode = '';

    async function copyCode() {
      if (!currentCode) return;
      try {
        await navigator.clipboard.writeText(currentCode);
        copyBtn.innerHTML = '<i class="fas fa-check" style="margin-right:6px;"></i> Copied!';
        copyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        setTimeout(() => {
          copyBtn.innerHTML = '<i class="fas fa-copy" style="margin-right:6px;"></i> Copy Code';
        }, 2000);
      } catch (err) {
        alert('Failed to copy. Please select and copy manually.');
      }
    }

    submitBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const rawNumber = numberInput.value.trim();

      if (!rawNumber) {
        pairDiv.innerHTML = `
          <div style="color:#ef4444; font-weight:600; padding:8px 0;">
            <i class="fas fa-exclamation-circle"></i> Enter your WhatsApp number
          </div>
        `;
        return;
      }

      const cleanNumber = rawNumber.replace(/[^0-9]/g, "");
      if (cleanNumber.length < 10) {
        pairDiv.innerHTML = `
          <div style="color:#ef4444; font-weight:600; padding:8px 0;">
            <i class="fas fa-times-circle"></i> Invalid number — include country code
          </div>
        `;
        return;
      }

      waitingMsg.style.display = "block";
      pairDiv.innerHTML = "";
      copyBtn.style.display = "none";

      try {
        const response = await axios.get(`/code?number=${cleanNumber}`);
        const code = response.data.code || "⚠️ Service unavailable";

        currentCode = code;

        pairDiv.innerHTML = `
          <div style="margin-top:4px;">
            <div class="code-label"><i class="fas fa-key"></i> Your pairing code</div>
            <div class="code-value" id="code-display" onclick="copyCode()">${code}</div>
            <div style="font-size:0.7rem; color:#9ca3af; margin-top:4px;">⬆️ click to copy</div>
          </div>
        `;

        copyBtn.style.display = "inline-block";
        copyBtn.innerHTML = '<i class="fas fa-copy" style="margin-right:6px;"></i> Copy Code';
        copyBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
        copyBtn.onclick = copyCode;

        waitingMsg.style.display = "none";

      } catch (err) {
        waitingMsg.style.display = "none";
        pairDiv.innerHTML = `
          <div style="color:#ef4444; font-weight:500; padding:8px 0;">
            <i class="fas fa-exclamation-triangle"></i> Server error — try again
          </div>
        `;
        console.error("Pair error:", err);
      }
    });

    numberInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitBtn.click();
    });

    setTimeout(() => numberInput.focus(), 300);
  </script>
</body>
</html>
